    - region [ref=e110]:
      - generic [ref=e111]:
        - generic [ref=e112]: Process · Wall Text
        - heading "How the field paints." [level=2] [ref=e113]
        - paragraph [ref=e114]: There is no brush and no image to copy. There is only a field of directions, a crowd of particles, and time.
      - generic [ref=e115]:
        - generic [ref=e116]:
          - generic [ref=e117]:
            - heading "The field is laid down" [level=3] [ref=e118]
            - paragraph [ref=e119]:
              - text: A seed — one integer — feeds
              - code [ref=e120]: mulberry32
              - text: ", and the numbers it breathes out build a lattice of fractal value noise. Sampled anywhere on the canvas, the noise returns an angle. The whole painting-to-be is already present here, invisible, like grain in uncut stone."
          - generic [ref=e121]:
            - heading "The particles walk" [level=3] [ref=e122]
            - paragraph [ref=e123]: "A few thousand particles drop onto the canvas and do the only thing they know: ask the field which way, step, ask again. Each step leaves a stroke of near-transparent pigment. None of them knows about composition. The field knows."
          - generic [ref=e124]:
            - heading "The sediment settles" [level=3] [ref=e125]
            - paragraph [ref=e126]: "Strokes accumulate like silt — thousands of layers a second at first, then slower, thinner, quieter. Color is geological: each particle is born into a stratum of its palette and carries that ink for life. When the surface reads as stone, the edition is on view."
        - figure "Fig. 1 — the direction field, sampled live · two walkers shown" [ref=e127]:
          - 'img "Animated diagram: a grid of small arrows showing the flow field reorienting, with two particles tracing paths through it" [ref=e128]'
