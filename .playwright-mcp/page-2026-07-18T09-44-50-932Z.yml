    - generic [ref=f1e96]:
      - paragraph [ref=f1e97]: Manifesto
      - paragraph [ref=f1e98]: There is a moment before the garment — before the seam, before the first mark on cloth — when nothing has been decided yet. Collection Nº14 lives inside that moment, and refuses to leave it.
      - paragraph [ref=f1e99]: Absence Absence
      - generic [ref=f1e100]: Absence.
      - paragraph [ref=f1e101]: We removed what a dress is expected to say. What is left is weight, fall, the quiet architecture of a body in a room. No print. No slogan. No proof of labor left on the surface. Six looks, one discipline — wool, silk, void.
      - paragraph [ref=f1e102]: Nothing performs here. Everything is worn the way a room holds its silence after the door closes.
