    - generic [ref=f8e95]:
      - paragraph [ref=f8e96]: Manifesto
      - paragraph [ref=f8e97]: There is a moment before the garment — before the seam, before the first mark on cloth — when nothing has been decided yet. Collection Nº14 lives inside that moment, and refuses to leave it.
      - paragraph [ref=f8e98]: Absence Absence
      - generic [ref=f8e99]: Absence.
      - paragraph [ref=f8e100]: We removed what a dress is expected to say. What is left is weight, fall, the quiet architecture of a body in a room. No print. No slogan. No proof of labor left on the surface. Six looks, one discipline — wool, silk, void.
      - paragraph [ref=f8e101]: Nothing performs here. Everything is worn the way a room holds its silence after the door closes.
