    - generic [ref=f12e114]:
      - paragraph [ref=f12e115]: Aurelia was founded in Grasse in 1947, in a house with seventeen windows and no electric light. Élise Aurel composed only between five and seven in the morning, when the air was still cold enough to hold one scent apart from another.
      - paragraph [ref=f12e116]: We keep her hours. Three compositions, never more; each touched only when its hour changes — which is to say, never quickly. The rest is patience, silk, and weather.
      - paragraph [ref=f12e117]: É. Aurel
