        - generic [ref=f2e64]:
          - paragraph [ref=f2e65]: "Ornament is a confession of poverty. We build with the circle, the square, the triangle — the three elemental forms every other form borrows from. Colour is not mood, it is instruction: yellow reaches, red presses, blue recedes. A composition is not arranged. It is balanced — forces held taut, not frozen. Nothing on this page is finished. It is only, for the length of your visit, at rest."
          - paragraph [ref=f2e66]: — Die Werkstatt, Weimar
